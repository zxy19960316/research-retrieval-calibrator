name: docs-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint with Ruff
        run: python -m ruff check app scripts tests
      - name: Type check with mypy
        run: python -m mypy app scripts
      - name: Validate project plan and phase files
        run: python scripts/validate_project_docs.py
