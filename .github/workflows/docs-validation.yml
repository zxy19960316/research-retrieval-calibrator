name: docs-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: >
          python -m pip install
          "jsonschema>=4.23,<5"
          "pydantic>=2.9,<3"
          "PyYAML>=6.0,<7"
          "build>=1.2,<2"
          "pytest>=8.3,<9"
          "ruff>=0.6,<1"
          "mypy>=1.11,<2"
          "setuptools>=68,<81"
          "wheel>=0.43,<1"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run source tests
        run: python -m pytest -q -m "not packaging"
      - name: Build and verify installed wheel
        run: python -m pytest -q -m packaging
      - name: Lint with Ruff
        run: python -m ruff check app evaluation scripts tests
      - name: Type check with mypy
        run: python -m mypy app evaluation scripts
      - name: Validate project plan and phase files
        run: python scripts/validate_project_docs.py
      - name: Validate completed M0 evidence
        run: python scripts/validate_phase.py M0
      - name: Validate completed M1 evidence
        run: python scripts/validate_m1_evidence.py
      - name: Validate M1 frozen intent replay repair
        run: python scripts/validate_m1_frozen_intent_replay_repair.py
      - name: Validate completed M2-T01 evidence
        run: python scripts/validate_m2_t01_evidence.py
      - name: Validate completed M2-T02 evidence
        run: python scripts/validate_m2_t02_evidence.py
      - name: Validate completed M2-T03 evidence
        run: python scripts/validate_m2_t03_evidence.py
      - name: Validate pending M2-T03 human adjudication bundle
        run: python scripts/validate_m2_t03_human_adjudication_bundle.py
