[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "research-retrieval-calibrator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "wheel>=0.43,<1",
]
embedding = [
  "FlagEmbedding==1.3.5",
  "torch==2.4.1",
]
reranker = [
  "torch==2.4.1",
  "transformers==4.53.2",
  "huggingface-hub==0.34.3",
  "safetensors==0.5.3",
  "tokenizers==0.21.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "packaging: build and validate wheel and editable installation artifacts",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
